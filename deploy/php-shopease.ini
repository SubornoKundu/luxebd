; Copy to the PHP-FPM conf.d folder, e.g. /etc/php/8.4/fpm/conf.d/99-shopease.ini, then restart php8.4-fpm.
upload_max_filesize = 20M
post_max_size = 64M
max_file_uploads = 30
memory_limit = 256M
max_execution_time = 120
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; after each deploy run: sudo systemctl reload php8.4-fpm
